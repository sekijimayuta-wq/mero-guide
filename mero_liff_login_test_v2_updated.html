<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>mero｜体験配信のお申し込み</title>
<style>body{margin:0;font-family:-apple-system,BlinkMacSystemFont,'Hiragino Kaku Gothic ProN',sans-serif;background:#eef8f9;color:#344b55}.wrap{max-width:600px;margin:0 auto;padding:20px 14px}header{text-align:center;font-size:35px;letter-spacing:.13em;color:#4a9eac;margin:10px}#notice{background:white;padding:18px;border-radius:16px;text-align:center;line-height:1.8}iframe{display:none;width:100%;border:0;min-height:1100px;background:#eef8f9}button{background:#318e9e;color:white;border:0;padding:12px 18px;border-radius:12px;font-size:16px}</style>
</head><body><div class="wrap"><header>mero</header><div id="notice">LINEの認証を確認しています…</div><iframe id="form" title="体験配信お申し込みフォーム" referrerpolicy="no-referrer"></iframe></div>
<script>
'use strict';
const LIFF_ID='2012159345-32W4mgIJ';
// Replace only with the current /exec URL copied from Apps Script > Manage deployments.
const GAS_WEB_APP_URL='https://script.google.com/macros/s/AKfycbzbv3GhiiBZBRQLpZI7Zyk5lbMqA-1ZdBZ1J-Z24zJ2knZASrTBNdrTXXLoE2PTAAQK6Q/exec';
const notice=document.getElementById('notice');
const frame=document.getElementById('form');
let token=null, lastSent=0;
function loadLiffSdk(){
  return new Promise((resolve,reject)=>{
    const script=document.createElement('script');
    script.src='https://static.line-scdn.net/liff/edge/versions/2.31.2/sdk.js';
    script.charset='utf-8';
    script.async=true;
    const timer=setTimeout(()=>{script.remove();reject(new Error('LINE認証ライブラリの読み込みがタイムアウトしました。通信環境を確認して再度開いてください。'));},12000);
    script.onload=()=>{clearTimeout(timer);if(window.liff&&typeof window.liff.init==='function')resolve(window.liff);else reject(new Error('LINE認証ライブラリを利用できません。ページを再読み込みしてください。'));};
    script.onerror=()=>{clearTimeout(timer);reject(new Error('LINE認証ライブラリを読み込めませんでした。通信環境を確認してください。'));};
    document.head.appendChild(script);
  });
}
function showError(message){notice.textContent=message;frame.style.display='none';}
window.addEventListener('message',event=>{
  // The GAS iframe can be hosted on script.google.com or script.googleusercontent.com.
  if(event.source!==frame.contentWindow) return;
  if(!/^https:\/\/(script\.google\.com|[a-z0-9-]+\.googleusercontent\.com)$/.test(event.origin))return;
  if(event.data?.type==='MERO_FORM_READY' && token){
    if(Date.now()-lastSent<300)return;
    lastSent=Date.now();
    frame.contentWindow.postMessage({type:'MERO_LINE_TOKEN',idToken:token},event.origin);
  }
  if(event.data?.type==='MERO_AUTH_OK'){notice.style.display='none';frame.style.display='block';}
  if(event.data?.type==='MERO_AUTH_ERROR')showError('LINE認証を確認できませんでした。公式LINEから開き直してください。');
});
(async()=>{
  try{
    if(!GAS_WEB_APP_URL.startsWith('https://script.google.com/macros/s/')||!GAS_WEB_APP_URL.endsWith('/exec'))throw new Error('フォームの公開URLが未設定です');
    const liffSdk=await loadLiffSdk();
    notice.textContent='LINEの認証を確認しています…';
    await liffSdk.init({liffId:LIFF_ID});
    if(!liffSdk.isLoggedIn()){
      if(liffSdk.isInClient())throw new Error('LINE内で認証が完了しませんでした。公式LINEから開き直してください。');
      liffSdk.login({redirectUri:location.origin+location.pathname});return;
    }
    token=liffSdk.getIDToken();
    if(!token)throw new Error('LINEの認証情報を取得できませんでした');
    frame.src=GAS_WEB_APP_URL;
    notice.textContent='申し込みフォームを読み込んでいます…';
  }catch(err){showError(err.message||'LINE認証に失敗しました');}
})();
</script></body></html>
