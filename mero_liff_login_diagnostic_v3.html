<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>mero｜LINEログイン診断（テスト専用）</title>
<style>body{margin:0;background:#eef8f9;color:#344b55;font-family:-apple-system,BlinkMacSystemFont,'Hiragino Kaku Gothic ProN',sans-serif}.wrap{max-width:560px;margin:30px auto;padding:16px}.logo{text-align:center;font-size:40px;color:#4a9eac;letter-spacing:.14em}.panel{background:white;padding:24px;border-radius:20px;line-height:1.8}#status{white-space:pre-wrap;overflow-wrap:anywhere}.note{font-size:13px;color:#697d83}button{background:#318e9e;color:white;border:0;border-radius:12px;padding:12px 18px;font-size:16px}</style></head>
<body><div class="wrap"><div class="logo">mero</div><div class="panel"><h2>LINEログイン診断</h2><p id="status" role="status" aria-live="polite">認証ライブラリを読み込んでいます…</p><button id="retry" hidden onclick="location.reload()">再試行する</button><p class="note">テスト専用です。申込フォームは開かず、身分証・個人情報・認証トークンを外部に送信しません。</p></div></div>
<script>
'use strict';
const LIFF_ID='2012159345-32W4mglJ';
const status=document.getElementById('status');
const retry=document.getElementById('retry');
function fail(message){status.textContent='確認できませんでした：'+message;retry.hidden=false;}
function timeout(promise,ms,message){return Promise.race([promise,new Promise((_,reject)=>setTimeout(()=>reject(new Error(message)),ms))]);}
function loadSdk(){return new Promise((resolve,reject)=>{let done=false;const s=document.createElement('script');const t=setTimeout(()=>finish(new Error('LIFF SDKの読み込みが15秒以内に完了しませんでした。通信環境を確認してください。')),15000);function finish(error){if(done)return;done=true;clearTimeout(t);if(error)reject(error);else resolve(window.liff);}s.src='https://static.line-scdn.net/liff/edge/2/sdk.js';s.onload=()=>window.liff&&typeof window.liff.init==='function'?finish():finish(new Error('LIFF SDKが利用できません。'));s.onerror=()=>finish(new Error('LIFF SDKの取得に失敗しました。'));document.head.appendChild(s);});}
(async()=>{try{const sdk=await loadSdk();status.textContent='LIFFを初期化しています…';await timeout(sdk.init({liffId:LIFF_ID}),20000,'LIFF初期化がタイムアウトしました。LIFF IDとエンドポイントURLを確認してください。');if(!sdk.isLoggedIn()){if(sdk.isInClient())throw new Error('LINEアプリ内でログイン状態を確認できませんでした。');status.textContent='LINEログイン画面へ移動しています…';sdk.login({redirectUri:location.origin+location.pathname});return;}const idToken=sdk.getIDToken();if(!idToken)throw new Error('ログイン済みですがIDトークンを取得できません。LIFFのopenidスコープを確認してください。');status.textContent='LINEログイン成功！\nLIFF初期化：成功\nログイン状態：確認済み\nIDトークン取得：成功\n\n※フォームへの認証連携は未検証です。';}catch(e){fail(e&&e.message?e.message:'原因不明のエラー');}})();
</script></body></html>
